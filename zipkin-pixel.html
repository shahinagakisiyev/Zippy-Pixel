  if(toastT>0){ctx.globalAlpha=clamp(toastT/25,0,1);tx(toast,W/2,H/2-30-(toastT>95?(toastT-95)*2:0),toastT>100?12:10,'#ffe066');ctx.globalAlpha=1}
  {let k=0;for(const c of ab){if(!AC.includes(c))continue;const r=1-(cdm[c]||0)/CD[c];ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(6+k*24,H-26,22,8);ctx.fillStyle=r>=1?'#ffe066':'#7a7494';ctx.fillRect(7+k*24,H-25,20*r,6);k++}}
  if(st==='zone'){card('z'+zi,'DOKUN: DEVAM');if(unl>0){const u=SK[unl];tx('YENİ KARAKTER!',W/2,334,6,Math.floor(t/10)%2?'#ffe066':'#ffffff');ctx.drawImage(SKS[unl],W/2-12,342+Math.sin(t*.1)*3,24,32);tx(u[0],W/2,392,6,'#ffffff');tx([...u[11]].map(c=>L(AD[c])).join(' · ').slice(0,34),W/2,406,5,'#8890aa')}}
  if(st==='end')card('end','DOKUN: BAŞA DÖN');
  if(st==='pause'){ctx.fillStyle='rgba(8,6,20,.8)';ctx.fillRect(0,0,W,H);tx('DURAKLATILDI',W/2,H/2,12,'#fff');}
  if(st==='over'&&dth){const f=t-dth.t0;drawDeathMsg(f);if(f>=DPANEL&&!dth.ui){dth.ui=1;UI.style.visibility=''}}
  if(st==='over'&&dth&&t-dth.t0>=DPANEL){ctx.globalAlpha=Math.min(1,(t-dth.t0-DPANEL)/18);
   ctx.fillStyle='rgba(8,6,20,.88)';ctx.save();ctx.translate(0,90);ctx.fillRect(12,80,W-24,170);ctx.strokeStyle='#ec3750';ctx.lineWidth=2;ctx.strokeRect(13,81,W-26,168);
   tx('DÜŞTÜN...',W/2,112,12,'#ec3750');tx('Ama düşmek son değil.',W/2,138,7,'#fff');tx('Yükseklik: '+m+' m',W/2,170,8,'#fff');tx('Rekor: '+hi+' m',W/2,190,8,'#c8cde0');tx('Yıldız: '+stars,W/2,210,8,'#ffe066');
   tx('+'+lastGain+' XP · SEVİYE '+lvlOf(liveXp()),W/2,232,7,'#6fdc8c');ctx.restore();ctx.globalAlpha=1;
  }
 }
 ctx.restore();
}
let last=performance.now(),acc=0;
function loop(n){
 acc+=Math.min(n-last,100);last=n;
 while(acc>=16.667){acc-=16.667;if(st==='intro'){it++;if(it===150)beep(520,.12,'sine',.04);if(it===205)beep(784,.25,'sine',.05);if(it===250||it===322)beep(990,.03,'sine',.03);if(it===335||it===368)beep(300,.06,'square',.03);if((it>=395&&it<=419&&(it-395)%6===0)||(it>=430&&it<=454&&(it-430)%6===0))beep(300+it*1.2,.05);if(it===470)flash=16;if(it>=540)go(cur?'title':'login')}if(tr){tr.f++;if(tr.ph===0&&tr.f>=14){tr.ph=1;tr.f=0;const to=tr.to;if(to==='run'){startRun(selZ);setSt('play')}else if(to==='open'){cs={k:'open',f:0,b:[],end:1e9};setSt('cine')}else if(to==='nx'){next();setSt('play')}else if(to==='rz'){restartZone();setSt('play')}else setSt(to)}else if(tr.ph===1&&tr.f>=14)tr=null}if(st==='play')update();else{t++;if(st==='cine'){cs.f++;cineSfx();if(cs.k==='open'&&cs.f===640)go('run')}if(st==='zone'||st==='end'){if(t%3===0)burst(rnd(0,W),camY+rnd(0,H/2),'#ffe066',1)}if(parts.length){for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.05;q.l--}parts=parts.filter(q=>q.l>0)}}}
 draw();wipe();requestAnimationFrame(loop);
}
function act(){
 if(st==='intro'){if(it>20)go(cur?'title':'login')}
 else if(st==='story'){acct.seen=true;save();startRun(selZ);setSt('play')}
 else if(st==='zone'){next();setSt('play')}
 else if(st==='cine')cineTap();else if(st==='over'){if(dth&&t-dth.t0<DPANEL)dth.t0=t-DPANEL}
 else if(st==='play'&&arguments[0]===1)useAb();
 else if(st==='end')go('title');
 else if(st==='pause')setSt('play');
}
function pause(){if(st==='play')setSt('pause');else if(st==='pause')setSt('play')}
const px=e=>{const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W};
cv.addEventListener('pointermove',e=>{ptr=px(e)});
cv.addEventListener('pointerdown',e=>{ptr=px(e);act()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter')submit();return}
 if(e.key==='ArrowLeft'||e.key==='a')keys.l=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.r=true;
 if(e.key===' '||e.key==='Enter'){e.preventDefault();act(1)}
 if(e.key==='p'||e.key==='Escape')pause();
 if(e.key==='m')mute();
});
addEventListener('keyup',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')setSt('pause')});
function mute(){muted=!muted;cfg.snd=!muted;saveCfg();document.getElementById('bm').textContent=muted?'🔇':'🔊'}
document.getElementById('ba').addEventListener('pointerdown',e=>{e.preventDefault();useAb()});document.getElementById('bp').onclick=pause;document.getElementById('bm').onclick=mute;
const vv=window.visualViewport,wr=cv.parentNode;
function kbFit(){wr.style.transform='';const ae=document.activeElement,pn=UI.querySelector('.panel');if(!ae||ae.tagName!=='INPUT'||!pn||!vv)return;const r=pn.getBoundingClientRect(),a=ae.getBoundingClientRect(),tp=vv.offsetTop+4,bt=vv.offsetTop+vv.height-4;let dy=0;if(r.bottom>bt)dy=bt-r.bottom;if(r.top+dy<tp)dy=tp-r.top;if(a.bottom+dy>bt)dy=bt-a.bottom;if(a.top+dy<tp)dy=tp-a.top;wr.style.transform='translateY('+dy+'px)'}
if(vv){vv.addEventListener('resize',kbFit);vv.addEventListener('scroll',kbFit)}
addEventListener('focusin',e=>{if(e.target.tagName==='INPUT'){UI.classList.add('kb');window.scrollTo(0,0);setTimeout(kbFit,60);setTimeout(()=>{window.scrollTo(0,0);kbFit()},350)}});
addEventListener('focusout',()=>setTimeout(()=>{const ae=document.activeElement;if(!ae||ae.tagName!=='INPUT'){UI.classList.remove('kb');kbFit()}},250));
UI.addEventListener('mousedown',e=>{if(e.target.closest('[data-a="eye"]'))e.preventDefault()});
p={x:W/2,y:H-20,vx:0,vy:0,hurt:0,sq:0,face:1};
requestAnimationFrame(loop);
})();
